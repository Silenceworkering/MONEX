function add(data={}){const f=$('#form');f.reset();f.elements.date.value=data.date||new Date().toLocaleDateString('sv-SE');f.elements.type.value=data.type||'expense';f.elements.amount.value=data.amount||'';f.elements.note.value=data.note||'';f.elements.category.value=data.category||'Продукты';$('#dlg').showModal()}$('#form').onsubmit=e=>{e.preventDefault();let f=e.target,amount=Number(f.elements.amount.value);if(!(amount>0))return;db.items.push({id:Date.now(),type:f.elements.type.value,amount,category:f.elements.category.value,note:f.elements.note.value,date:f.elements.date.value});save();$('#dlg').close();render()};
function setupSettings(){$('#settingsSave').onclick=()=>{db.budget=Math.max(1,Number($('#budget').value)||30000);db.goal=Math.max(1,Number($('#goal').value)||100000);save();render()};$('#export').onclick=()=>{let a=document.createElement('a'),blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='FINORA-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#import').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!Array.isArray(v.items))throw Error();if(!confirm('Заменить текущие данные резервной копией?'))return;db=v;save();render()}catch{alert('Не удалось прочитать резервную копию')}}}
function setupScan(){let file;$('#receipt').onchange=e=>{file=e.target.files[0];if(file){$('#preview').src=URL.createObjectURL(file);$('#preview').hidden=false}};$('#recognize').onclick=async()=>{if(!file){alert('Сначала выберите фотографию чека');return}let s=$('#scanStatus');s.textContent='Распознавание…';try{if(!window.Tesseract){await new Promise((resolve,reject)=>{let t=document.createElement('script');t.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';t.onload=resolve;t.onerror=reject;document.head.appendChild(t)})}let r=await Tesseract.recognize(file,'rus+eng'),txt=r.data.text;let matches=[...txt.matchAll(/(?:итого|сумма|к оплате|всего|total)[^\d]{0,30}(\d[\d\s]*[.,]\d{2})/gi)],raw=matches.at(-1)?.[1]||[...txt.matchAll(/\b\d{1,7}[.,]\d{2}\b/g)].map(x=>x[0]).at(-1)||'',amount=Number(raw.replace(/\s/g,'').replace(',','.'));s.textContent='Распознано. Проверьте сумму и дату.';add({amount:Number.isFinite(amount)?amount:'',note:txt.split('\n').find(x=>x.trim().length>4)?.trim().slice(0,80)||'Покупка по чеку'})}catch(err){s.textContent='Не удалось распознать чек. Попробуйте другое фото или введите сумму вручную.'}}}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
