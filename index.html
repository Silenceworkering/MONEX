const accentThemes={emerald:{name:'Изумрудный',hex:'#6df5b4',rgb:'109,245,180'},blue:{name:'Синий',hex:'#6abaff',rgb:'106,186,255'},purple:{name:'Фиолетовый',hex:'#b69aff',rgb:'182,154,255'},rose:{name:'Розовый',hex:'#ff91b7',rgb:'255,145,183'},gold:{name:'Золотой',hex:'#f3ce79',rgb:'243,206,121'},ice:{name:'Ледяной',hex:'#92e9f3',rgb:'146,233,243'}};
function applyAccent(){const t=accentThemes[db.accent]||accentThemes.emerald;document.documentElement.style.setProperty('--accent',t.hex);document.documentElement.style.setProperty('--accent-rgb',t.rgb);document.querySelector('meta[name="theme-color"]').content='#061610'}
const iconPaths={house:'<path d="M3.5 10.5 12 3l8.5 7.5V20a1 1 0 0 1-1 1h-5.5v-7h-4v7H4.5a1 1 0 0 1-1-1z"/>',receipt:'<path d="M5 3h14v18l-3.5-2-3.5 2-3.5-2L5 21z"/><path d="M9 8h6M9 12h6M9 16h3"/>',chart:'<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M7 16l4-4 3 2 4-6"/><path d="M15 8h3v3"/>',bag:'<rect x="4" y="7" width="16" height="14" rx="3"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/><path d="M9 14h6"/>',user:'<circle cx="12" cy="8" r="3.7"/><path d="M5 20c.4-4.1 2.9-6.1 7-6.1s6.6 2 7 6.1"/><circle cx="12" cy="12" r="9.2" opacity=".22"/>',up:'<path d="M12 19V5m-6 6 6-6 6 6"/><rect x="3" y="3" width="18" height="18" rx="5" opacity=".3"/>',down:'<path d="M12 5v14m-6-6 6 6 6-6"/><rect x="3" y="3" width="18" height="18" rx="5" opacity=".3"/>'};function navIcon(k){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+(iconPaths[k]||iconPaths.house)+'</svg>'}
function initMoneyRain(){let root=document.getElementById('moneyRain');if(!root)return;let count=window.innerWidth<550?10:18;let fragment=document.createDocumentFragment();for(let i=0;i<count;i++){let b=document.createElement('div');b.className='money-bill';b.style.setProperty('--left',(Math.random()*100)+'%');b.style.setProperty('--size',(22+Math.random()*21)+'px');b.style.setProperty('--duration',(13+Math.random()*17)+'s');b.style.setProperty('--delay',(-Math.random()*30)+'s');b.style.setProperty('--drift',((Math.random()-.5)*110)+'px');fragment.appendChild(b)}root.appendChild(fragment)}
function compressImage(file,maxW=700,maxH=700){return new Promise((resolve,reject)=>{if(!file.type.startsWith('image/'))return reject(Error('not image'));let u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);let scale=Math.min(1,maxW/im.width,maxH/im.height),w=Math.max(1,Math.round(im.width*scale)),h=Math.max(1,Math.round(im.height*scale)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);resolve(c.toDataURL('image/jpeg',.7))};im.onerror=()=>{URL.revokeObjectURL(u);reject(Error('bad image'))};im.src=u})}
function deletePurchase(id){if(!confirm('Удалить покупку из коллекции?'))return;db.purchases=(db.purchases||[]).filter(x=>x.id!==id);save();render();toast('Покупка удалена')}
document.getElementById('itemForm').onsubmit=async e=>{e.preventDefault();const f=e.target;try{let photo=f.elements.photo.files[0]?await compressImage(f.elements.photo.files[0],650,650):'';db.purchases=db.purchases||[];db.purchases.unshift({id:Date.now(),title:f.elements.title.value.trim().slice(0,70),price:Math.max(0,Number(f.elements.price.value)),description:f.elements.description.value.trim().slice(0,250),photo});save();document.getElementById('itemDlg').close();f.reset();render();toast('Покупка добавлена')}catch{alert('Не удалось сохранить. Возможно, закончилось место в браузере. Скачай резервную копию и попробуй фото поменьше.')}}; 
async function hashPin(pin,salt){let bytes=new TextEncoder().encode(salt+':'+pin),buf=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(buf)).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function changePin(){if(db.pinHash){let old=prompt('Введи текущий PIN');if(old===null)return;if(await hashPin(old,db.pinSalt)!==db.pinHash){alert('Неверный PIN');return}}let pin=prompt('Новый PIN: 4–8 цифр');if(pin===null)return;if(!/^\d{4,8}$/.test(pin)){alert('PIN должен состоять из 4–8 цифр');return}if(prompt('Повтори новый PIN')!==pin){alert('PIN не совпадает');return}let salt=Array.from(crypto.getRandomValues(new Uint8Array(16))).map(x=>x.toString(16).padStart(2,'0')).join('');db.pinSalt=salt;db.pinHash=await hashPin(pin,salt);save();render();toast('PIN установлен');showLock()}
async function removePin(){let pin=prompt('Введи текущий PIN');if(pin===null)return;if(await hashPin(pin,db.pinSalt)!==db.pinHash){alert('Неверный PIN');return}delete db.pinHash;delete db.pinSalt;save();render();toast('PIN отключён')}
function showLock(){if(!db.pinHash||document.getElementById('finLock'))return;let el=document.createElement('div');el.className='lock-screen';el.id='finLock';el.innerHTML='<div class="lock-card"><div style="font-size:43px;color:var(--accent)">◈</div><h2>FINORA</h2><p>Введи PIN-код для доступа</p><form id="unlockForm"><input id="unlockPin" type="password" inputmode="numeric" autocomplete="off" pattern="[0-9]{4,8}" minlength="4" maxlength="8" placeholder="••••" required><button class="primary wide">Разблокировать</button></form><p id="unlockError"></p><p>Если забыл PIN, доступ к данным можно восстановить только через очистку данных сайта. PIN не является шифрованием.</p></div>';document.body.append(el);document.getElementById('unlockForm').onsubmit=async e=>{e.preventDefault();let pin=document.getElementById('unlockPin').value;if(await hashPin(pin,db.pinSalt)===db.pinHash){el.remove();toast('С возвращением!')}else{document.getElementById('unlockError').textContent='Неверный PIN';document.getElementById('unlockPin').value=''}}}

initMoneyRain();render();if(db.pinHash)showLock();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
