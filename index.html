<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10101a"><title>MONEX — Финансы</title><style>*{box-sizing:border-box}body{margin:0;background:#0e0e17;color:#f6f4ff;font:15px system-ui,Arial}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 15px;background:#302a45;color:white}.primary{background:#7855e8}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{color:#bba5ff;margin:0;font-size:25px}.layout{display:flex;min-height:100vh}aside{width:235px;background:#171622;border-right:1px solid #333045;padding:25px 14px}nav{display:grid;gap:5px;margin-top:25px}nav button{text-align:left;background:none;color:#bbb5d1}nav button.active{background:#33284c;color:white}main{width:100%;max-width:1150px;margin:auto;padding:30px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:25px 0}.card{background:#1c1b2b;border:1px solid #343048;border-radius:18px;padding:20px;margin-bottom:14px}.num{font-size:28px;font-weight:750;margin-top:10px}.muted{color:#aaa4c1}.green{color:#60dfb0}.red{color:#ff8da5}.purple{color:#c2a5ff}.entry{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #353148;padding:13px 0}.entry:last-child{border:0}.row{display:flex;gap:9px;flex-wrap:wrap}dialog{width:min(95vw,450px);border:1px solid #55466d;border-radius:20px;background:#1d1b2b;color:white;padding:24px}dialog::backdrop{background:#000b}label{display:block;margin:13px 0 5px}input,select{width:100%;background:#11101b;color:white;border:1px solid #524867;border-radius:10px;padding:12px}.small{font-size:12px} @media(max-width:700px){.layout{display:block}aside{width:100%;padding:15px;border:0}nav{display:flex;overflow:auto;margin-top:12px}nav button{white-space:nowrap}main{padding:16px}.cards{grid-template-columns:1fr}header{align-items:flex-start}}</style></head><body><div class="layout"><aside><h1>◈ MONEX</h1><nav id="nav"></nav></aside><main><header><div><div class="muted small">ЛИЧНЫЙ ФИНАНСОВЫЙ ЦЕНТР</div><h2 id="heading">Обзор</h2></div><div class="row"><button id="export">Экспорт</button><button class="primary" id="add">+ Операция</button></div></header><section id="content"></section></main></div><dialog id="dlg"><form id="form"><h2>Новая операция</h2><label>Тип</label><select name="type"><option value="expense">Расход</option><option value="income">Доход</option><option value="transfer">Перевод</option></select><label>Сумма, ₽</label><input name="amount" type="number" min=".01" step=".01" required><label>Категория</label><input name="category" maxlength="70" required><label>Счёт</label><select name="account" id="accountSelect"></select><label>На счёт (для перевода)</label><select name="to" id="toSelect"></select><div class="row" style="margin-top:20px"><button class="primary">Сохранить</button><button type="button" id="close">Отмена</button></div></form></dialog><script src="./app.js"></script></body></html>
