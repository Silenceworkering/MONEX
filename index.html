<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d17"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><title>FINORA — Финансы</title><style>
:root{font-family:Inter,system-ui,Arial;background:#090b13;color:#f8f8ff;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0,#31215a66,transparent 50%),#090b13;min-height:100vh}main{max-width:520px;margin:auto;padding:22px 18px 115px}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-size:25px;font-weight:900;letter-spacing:2px}.brand b{color:#a48cff}.muted{color:#aaa9c1;font-size:13px}.panel{background:linear-gradient(135deg,#22213a,#151827);border:1px solid #ffffff17;border-radius:25px;padding:22px;margin-top:17px;box-shadow:0 15px 35px #0003}.balance{font-size:38px;font-weight:800;letter-spacing:-1px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.green{color:#5fe3b2}.pink{color:#ff829d}.purple{color:#b7a3ff}.stat{font-size:22px;font-weight:750;margin:7px 0}h2{font-size:19px;margin:25px 0 10px}.entry{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #ffffff12}.entry:last-child{border:0}.circle{width:40px;height:40px;border-radius:14px;background:#7861ce33;display:grid;place-items:center;font-size:20px;margin-right:12px}.entryLeft{display:flex;align-items:center}.entry strong{display:block;font-size:14px}.entry small{color:#9d9db3}.nav{position:fixed;bottom:0;left:0;right:0;background:#141522ef;backdrop-filter:blur(20px);border-top:1px solid #ffffff19;display:flex;justify-content:space-around;padding:12px 4px calc(12px + env(safe-area-inset-bottom))}.nav button{border:0;background:none;color:#aaa7c4;display:grid;gap:3px;justify-items:center;font-size:11px}.nav button.active{color:#bbaaff}.nav i{font-style:normal;font-size:22px}button{cursor:pointer}button.primary{border:0;border-radius:15px;padding:13px 17px;background:linear-gradient(125deg,#9275ff,#6746dd);color:white;font-weight:700}.actions{display:flex;gap:10px;margin-top:16px}.actions button{flex:1}select,input{width:100%;border:1px solid #48445e;background:#171727;color:white;padding:13px;border-radius:12px;font:inherit;margin:7px 0 13px}label{font-size:13px;color:#c4c2d3}dialog{width:min(94vw,450px);background:#1a1929;border:1px solid #51466c;color:white;border-radius:24px;padding:22px}dialog::backdrop{background:#000b}.bar{height:11px;background:#343048;border-radius:10px;overflow:hidden;margin:8px 0 14px}.bar span{height:100%;display:block;background:linear-gradient(90deg,#8a6bff,#d58cfa);border-radius:10px}.month{display:flex;gap:9px;align-items:center}.month select{margin:0}.link{background:none;color:#bca9ff;border:0;padding:9px}.empty{color:#aaa7bd;text-align:center;padding:25px}.scan{border:1px dashed #7660a0;border-radius:18px;padding:20px;text-align:center}.scan input{font-size:12px}#preview{max-width:100%;max-height:220px;border-radius:12px} 
</style></head><body><main><div class="top"><div class="brand">FIN<b>ORA</b></div><span class="muted">Личные финансы ✦</span></div><div id="page"></div></main><nav class="nav" id="nav"></nav><dialog id="dlg"><h2>Новая операция</h2><form id="form"><label>Тип операции</label><select name="type"><option value="expense">Расход</option><option value="income">Доход</option></select><label>Сумма, ₽</label><input name="amount" type="number" min="0.01" step="0.01" required><label>Категория</label><select name="category"><option>Продукты</option><option>Кафе</option><option>Транспорт</option><option>Покупки</option><option>Развлечения</option><option>Здоровье</option><option>Жильё</option><option>Зарплата</option><option>Другое</option></select><label>Магазин / описание</label><input name="note" maxlength="100" placeholder="Например, супермаркет"><label>Дата</label><input name="date" type="date" required><button class="primary" style="width:100%">Сохранить</button><button type="button" class="link" onclick="dlg.close()">Отмена</button></form></dialog><script>
const key='finora_data_v12';let db;try{db=JSON.parse(localStorage.getItem(key))||{items:[],budget:30000,goal:100000}}catch{db={items:[],budget:30000,goal:100000}};let tab='home',month=new Date().toISOString().slice(0,7);const $=x=>document.querySelector(x),money=x=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(x),save=()=>localStorage.setItem(key,JSON.stringify(db)),esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),monthItems=()=>db.items.filter(x=>x.date.slice(0,7)===month),sum=(a,t)=>a.filter(x=>x.type===t).reduce((s,x)=>s+Number(x.amount),0),allBalance=()=>sum(db.items,'income')-sum(db.items,'expense'),cats=()=>Object.entries(monthItems().filter(x=>x.type==='expense').reduce((a,x)=>(a[x.category]=(a[x.category]||0)+Number(x.amount),a),{})).sort((a,b)=>b[1]-a[1]),icons={'Продукты':'🛒','Кафе':'☕','Транспорт':'🚕','Покупки':'🛍️','Развлечения':'🎮','Здоровье':'💊','Жильё':'🏠','Зарплата':'💰','Другое':'✨'},entry=x=>'<div class="entry"><div class="entryLeft"><div class="circle">'+(icons[x.category]||'✨')+'</div><div><strong>'+esc(x.note||x.category)+'</strong><small>'+esc(x.category)+' · '+esc(x.date)+'</small></div></div><strong class="'+(x.type==='income'?'green':'pink')+'">'+(x.type==='income'?'+':'−')+money(x.amount)+'</strong></div>',period=()=>'<div class="month"><select id="monthSel">'+Array.from({length:24},(_,i)=>{let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);let v=d.toISOString().slice(0,7);return '<option value="'+v+'" '+(v===month?'selected':'')+'>'+d.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})+'</option>'}).join('')+'</select></div>';
function render(){const it=monthItems(),expense=sum(it,'expense'),income=sum(it,'income');$('#nav').innerHTML=[['home','⌂','Главная'],['history','▤','История'],['analytics','◉','Аналитика'],['scan','▣','Чеки'],['settings','⚙','Настройки']].map(x=>'<button class="'+(tab===x[0]?'active':'')+'" data-tab="'+x[0]+'"><i>'+x[1]+'</i>'+x[2]+'</button>').join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});let out='';
if(tab==='home')out='<div class="panel"><div class="muted">ОБЩИЙ БАЛАНС</div><div class="balance">'+money(allBalance())+'</div><div class="muted">Ваш финансовый обзор</div><div class="actions"><button class="primary" onclick="add()">＋ Добавить</button><button class="primary" onclick="tab=\'scan\';render()">▣ Чек</button></div></div><div class="grid"><div class="panel"><div class="muted">Доходы за месяц</div><div class="stat green">'+money(income)+'</div></div><div class="panel"><div class="muted">Расходы за месяц</div><div class="stat pink">'+money(expense)+'</div></div></div><h2>Последние операции</h2><div class="panel">'+(db.items.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6).map(entry).join('')||'<div class="empty">Добавьте первую операцию</div>')+'</div>';
if(tab==='history')out='<h2>История по месяцам</h2>'+period()+'<div class="grid"><div class="panel"><div class="muted">Доходы</div><div class="stat green">'+money(income)+'</div></div><div class="panel"><div class="muted">Расходы</div><div class="stat pink">'+money(expense)+'</div></div></div><div class="panel">'+(it.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(entry).join('')||'<div class="empty">В этом месяце операций нет</div>')+'</div><div class="actions"><button class="primary" onclick="add()">＋ Операция</button></div>';
if(tab==='analytics'){let c=cats();out='<h2>Аналитика расходов</h2>'+period()+'<div class="panel"><div class="muted">Потрачено за месяц</div><div class="balance">'+money(expense)+'</div><div class="muted">Месячный бюджет: '+money(db.budget)+'</div><div class="bar"><span style="width:'+Math.min(100,expense/Math.max(1,db.budget)*100)+'%"></span></div><small class="muted">Использовано '+Math.round(expense/Math.max(1,db.budget)*100)+'% бюджета</small></div><h2>Куда уходят деньги</h2><div class="panel">'+(c.map(([name,value])=>'<div> <div class="top"><strong>'+esc(name)+'</strong><span>'+money(value)+' · '+Math.round(value/Math.max(1,expense)*100)+'%</span></div><div class="bar"><span style="width:'+value/Math.max(1,expense)*100+'%"></span></div></div>').join('')||'<div class="empty">Пока нет расходов</div>')+'</div><h2>Динамика за 6 месяцев</h2><div class="panel">'+Array.from({length:6},(_,i)=>{let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-(5-i));let m=d.toISOString().slice(0,7),v=sum(db.items.filter(x=>x.date.startsWith(m)),'expense');return '<div class="top"><span>'+d.toLocaleDateString('ru-RU',{month:'short',year:'2-digit'})+'</span><strong>'+money(v)+'</strong></div><div class="bar"><span style="width:'+Math.min(100,v/Math.max(1,db.budget)*100)+'%"></span></div>'}).join('')+'</div>'}
if(tab==='scan')out='<h2>Сканирование чеков</h2><div class="panel"><div class="scan">📷<h2>Добавить чек</h2><p class="muted">Сфотографируйте чек или выберите изображение. Проверьте сумму перед сохранением.</p><input id="receipt" type="file" accept="image/*" capture="environment"><img id="preview" hidden><div id="scanStatus" class="muted"></div><button class="primary" id="recognize" style="margin-top:12px">Распознать чек</button></div></div><p class="muted">OCR загружается из внешней библиотеки. Требуется интернет; качество распознавания зависит от фото.</p>';
if(tab==='settings')out='<h2>Настройки</h2><div class="panel"><label>Бюджет на месяц, ₽</label><input id="budget" type="number" value="'+db.budget+'"><label>Цель накоплений, ₽</label><input id="goal" type="number" value="'+db.goal+'"><button class="primary" id="settingsSave">Сохранить настройки</button></div><div class="panel"><h2>Резервная копия</h2><button class="primary" id="export">Скачать данные</button><label>Восстановить из файла</label><input type="file" id="import" accept=".json,application/json"><p class="muted">Данные хранятся только в браузере этого устройства. Удаление данных браузера может стереть операции.</p></div>';
$('#page').innerHTML=out;if($('#monthSel'))$('#monthSel').onchange=e=>{month=e.target.value;render()};if(tab==='scan')setupScan();if(tab==='settings')setupSettings()}
function add(data={}){const f=$('#form');f.reset();f.elements.date.value=data.date||new Date().toLocaleDateString('sv-SE');f.elements.type.value=data.type||'expense';f.elements.amount.value=data.amount||'';f.elements.note.value=data.note||'';f.elements.category.value=data.category||'Продукты';$('#dlg').showModal()}$('#form').onsubmit=e=>{e.preventDefault();let f=e.target,amount=Number(f.elements.amount.value);if(!(amount>0))return;db.items.push({id:Date.now(),type:f.elements.type.value,amount,category:f.elements.category.value,note:f.elements.note.value,date:f.elements.date.value});save();$('#dlg').close();render()};
function setupSettings(){$('#settingsSave').onclick=()=>{db.budget=Math.max(1,Number($('#budget').value)||30000);db.goal=Math.max(1,Number($('#goal').value)||100000);save();render()};$('#export').onclick=()=>{let a=document.createElement('a'),blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='FINORA-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#import').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!Array.isArray(v.items))throw Error();if(!confirm('Заменить текущие данные резервной копией?'))return;db=v;save();render()}catch{alert('Не удалось прочитать резервную копию')}}}
function setupScan(){let file;$('#receipt').onchange=e=>{file=e.target.files[0];if(file){$('#preview').src=URL.createObjectURL(file);$('#preview').hidden=false}};$('#recognize').onclick=async()=>{if(!file){alert('Сначала выберите фотографию чека');return}let s=$('#scanStatus');s.textContent='Распознавание…';try{if(!window.Tesseract){await new Promise((resolve,reject)=>{let t=document.createElement('script');t.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';t.onload=resolve;t.onerror=reject;document.head.appendChild(t)})}let r=await Tesseract.recognize(file,'rus+eng'),txt=r.data.text;let matches=[...txt.matchAll(/(?:итого|сумма|к оплате|всего|total)[^\d]{0,30}(\d[\d\s]*[.,]\d{2})/gi)],raw=matches.at(-1)?.[1]||[...txt.matchAll(/\b\d{1,7}[.,]\d{2}\b/g)].map(x=>x[0]).at(-1)||'',amount=Number(raw.replace(/\s/g,'').replace(',','.'));s.textContent='Распознано. Проверьте сумму и дату.';add({amount:Number.isFinite(amount)?amount:'',note:txt.split('\n').find(x=>x.trim().length>4)?.trim().slice(0,80)||'Покупка по чеку'})}catch(err){s.textContent='Не удалось распознать чек. Попробуйте другое фото или введите сумму вручную.'}}}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
